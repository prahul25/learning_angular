<div class="flex flex-col items-center h-16">
    <h1 class="uppercase my-6">Here is my counter app</h1>
    <div class="flex items-center">
        <button class="bg-blue-500 text-white px-4 py-2 rounded-md" (click)="decrementCounter($event)">-</button>
        <span class="px-4">{{ counter }}</span>
        <button class="bg-blue-500 text-white px-4 py-2 rounded-md" (click)="incrementCounter($event)">+</button>
</div>
